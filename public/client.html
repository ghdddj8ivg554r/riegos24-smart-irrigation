<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1912"><title>Riegos24 · Mi riego</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#14231a;background:#eef3ef}*{box-sizing:border-box}body{margin:0;padding:20px;max-width:900px;margin:auto}.brand{font-weight:800;color:#167f3b;font-size:22px;margin:8px 0 20px}.card{background:white;border:1px solid #dce6df;border-radius:15px;padding:18px;margin:13px 0}h1{font-size:22px;margin:0 0 8px}h2{font-size:17px;margin:0 0 12px}p,.muted{color:#64746a;font-size:14px}label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}input,select{width:100%;padding:12px;border:1px solid #cbd8ce;border-radius:9px;font:inherit}button{border:0;border-radius:9px;background:#168344;color:white;padding:12px 16px;font-weight:700;cursor:pointer;margin-top:12px}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.zone,.event{border:1px solid #e0e8e2;padding:12px;border-radius:10px}.msg{padding:10px;border-radius:8px;background:#e7f5ec;color:#145b32;margin:12px 0}.error{background:#fdeaea;color:#9e2424}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
</style></head><body><div class="brand">◉ RIEGOS24 <span style="color:#64746a;font-weight:500">/ Mi riego</span></div>
<section id="login" class="card"><h1>Ingresar</h1><p>Usá el email y contraseña que recibiste al registrarte.</p><label>Email</label><input id="email" type="email" autocomplete="username"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">Ingresar</button><div id="msg"></div></section>
<section id="panel" class="hidden"><div class="top"><div><h1>Mis instalaciones</h1><p id="user"></p></div><button id="logout">Cerrar sesión</button></div><div class="card"><label>Seleccioná tu instalación</label><select id="site"></select><div id="overview"></div></div></section>
<script>
const $=id=>document.getElementById(id);let token=sessionStorage.getItem('r24_client_token')||'',sites=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function msg(t,err=false){$('msg').innerHTML='<div class="msg '+(err?'error':'')+'">'+esc(t)+'</div>'}
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Error de conexión');return d}
async function overview(){const id=$('site').value;if(!id)return;try{const d=await api('/api/client/installations/'+id+'/overview');$('overview').innerHTML='<h2>Dispositivos</h2><div class="grid">'+(d.devices||[]).map(x=>'<div class="zone"><strong>'+esc(x.label)+'</strong><p class="muted">Tuya · '+esc(x.enabled?'Habilitado':'Deshabilitado')+'</p></div>').join('')+'</div><h2 style="margin-top:20px">Zonas de riego</h2><div class="grid">'+(d.zones||[]).map(x=>'<div class="zone"><strong>'+esc(x.name)+'</strong><p class="muted">Canal: '+esc(x.channel_code)+'</p></div>').join('')+'</div><h2 style="margin-top:20px">Actividad reciente</h2>'+(d.events||[]).map(x=>'<div class="event"><strong>'+esc(x.event)+'</strong><p>'+esc(x.detail)+'</p><small class="muted">'+esc(new Date(x.created_at).toLocaleString('es-AR'))+'</small></div>').join('')+'<p class="muted">El control remoto de válvulas se habilitará cuando terminemos la integración multi-dispositivo y sus pruebas de seguridad.</p>';}catch(e){$('overview').textContent=e.message}}
async function boot(){try{const me=await api('/api/auth/me');$('user').textContent=me.user.email;const d=await api('/api/client/installations');sites=d.installations||[];$('site').innerHTML=sites.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('');$('login').classList.add('hidden');$('panel').classList.remove('hidden');if(sites.length)overview();else $('overview').textContent='Todavía no tenés instalaciones asignadas.'}catch(e){token='';sessionStorage.removeItem('r24_client_token')}}
$('loginBtn').onclick=async()=>{try{const d=await api('/api/auth/login',{email:$('email').value,password:$('password').value});token=d.access_token;sessionStorage.setItem('r24_client_token',token);await boot()}catch(e){msg(e.message,true)}};
$('site').onchange=overview;$('logout').onclick=()=>{sessionStorage.removeItem('r24_client_token');location.reload()};if(token)boot();
</script></body></html>
