<style>
/* ========== COLORES (claro, oscuro y automático) ========== */
:root{--g:#1f9d4d;--gb:#167f3b;--gl:#e7f5ec;--bg:#eef3ef;--c:#fff;--t:#14231a;--m:#5f6f65;--bd:#e0e8e2;--w:#2b8fd6;--al:#c2410c;--rd:#d32f32;--rl:#fdeaea;--nav:#0c1912;--pg:#d9e3dc;--sh:0 2px 12px rgba(18,40,28,.09)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#34c26a;--gl:#173324;--bg:#0b130e;--c:#14211a;--t:#e8f1ea;--m:#9db1a4;--bd:#243329;--w:#52aef0;--al:#ff8a4c;--rd:#ff6b6e;--rl:#3a1e20;--nav:#050a07;--pg:#040704;--sh:0 2px 12px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--g:#34c26a;--gl:#173324;--bg:#0b130e;--c:#14211a;--t:#e8f1ea;--m:#9db1a4;--bd:#243329;--w:#52aef0;--al:#ff8a4c;--rd:#ff6b6e;--rl:#3a1e20;--nav:#050a07;--pg:#040704;--sh:0 2px 12px rgba(0,0,0,.45)}

/* ========== BASE ========== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--pg);color:var(--t);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:100px;position:relative;overflow-x:hidden}
h2{margin:0;font-size:22px;font-weight:800}
h3{margin:0 0 8px;font-size:16.5px;font-weight:800}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--w);outline-offset:2px}
.s{color:var(--m);font-size:13px}
.i{width:20px;height:20px;flex:none}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.card{background:var(--c);border-radius:18px;box-shadow:var(--sh);padding:14px;margin:0 14px 12px}
code{font-size:12px;background:var(--bg);padding:1px 6px;border-radius:6px}

/* ========== ENCABEZADOS ========== */
.hd,.hh{position:relative;color:#fff}
.hd{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 64px 26px 16px;background:linear-gradient(120deg,#0e3b20,#1d7a3f 60%,#2b9b55);min-height:104px}
.hd .lg{width:60px;height:60px;flex:none}
.wm{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.5px;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.wm i{font-style:normal;color:#5cc8ff}.wm u{text-decoration:none;color:#a6e89a}
.sub{font-size:9.5px;letter-spacing:.5px;font-weight:600;opacity:.92;margin-top:3px;white-space:nowrap}
.hh{height:204px;overflow:hidden}
.hh .hbg{position:absolute;inset:0;width:100%;height:100%}
.hh .lg{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);width:124px;height:124px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
.gear{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.32);color:#fff;display:grid;place-items:center}
.demo{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 14px);border:0;background:rgba(0,0,0,.4);color:#fff;border-radius:99px;padding:5px 11px;font-size:11.5px;font-weight:600}
.hd .demo{left:auto;top:auto;right:14px;bottom:30px;padding:4px 10px}
.body{background:var(--bg);border-radius:22px 22px 0 0;margin-top:-16px;position:relative;padding-top:16px}
.tt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 16px 10px}
.sub2{padding:0 16px 10px;margin-top:-6px}
.tt h2{font-size:20px}
.tt .btn.sm{min-height:40px;padding:6px 12px;font-size:14px}
.fl.tight{gap:6px}
.fl.tight .fc{padding:7px 11px;font-size:13px;min-height:40px}

/* ========== CLIMA ========== */
.wcard{margin-top:-46px;position:relative;z-index:2}
.loc{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;margin-bottom:8px}
.loc .i{width:16px;height:16px;color:var(--g)}
.wr{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tp{display:flex;align-items:center;gap:8px;font-size:38px;font-weight:800;line-height:1}
.tp b{font-size:38px}
.wl{display:flex;flex-direction:column;gap:6px;font-size:13px}
.wl div{display:flex;align-items:center;gap:6px;color:var(--m)}
.wl b{color:var(--t);margin-left:auto;padding-left:8px}
.wl .i{width:16px;height:16px;color:var(--w)}
.mm{text-align:center;color:var(--m);font-size:13px;margin-top:10px}
.f7{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fd{background:var(--bg);border-radius:12px;padding:8px 2px;text-align:center;font-size:12px}
.fd b{display:block;font-size:13px}
.fd .e{font-size:22px;display:block}

/* ========== BOTONES Y CONTROLES ========== */
.btn{border:0;border-radius:14px;padding:12px 14px;font-weight:700;color:#fff;background:var(--gb);display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;line-height:1.15;text-align:center}
.btn.red{background:#d32f32}.btn.org{background:#c2410c}.btn.blue{background:#1f78b8}
.btn.ghost{background:var(--gl);color:var(--t)}
.btn.w{width:100%}.btn.sm{min-height:42px;padding:8px 14px}
.btn.dis{opacity:.45}
.big{display:flex;gap:10px;margin:0 14px 14px}
.big .btn{flex:1;min-height:66px;font-size:16px}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--c);display:grid;place-items:center;color:var(--m);flex:none;padding:0}
.ib.red{color:var(--rd);background:var(--rl);border-color:transparent}
.ib.arm{background:#d32f32;color:#fff}
.ib.ok{background:var(--gb);color:#fff;border-color:transparent}
.sw{width:52px;height:30px;border-radius:99px;border:0;background:#b9c4bd;position:relative;flex:none;padding:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s}
.sw.on{background:var(--gb)}.sw.on::after{transform:translateX(22px)}
.fl{display:flex;gap:8px;padding:0 14px 12px;overflow-x:auto;scrollbar-width:none}
.fl.wrap{flex-wrap:wrap;padding:0 0 10px}
.fc{border:1px solid var(--bd);background:var(--c);color:var(--t);border-radius:99px;padding:9px 16px;font-weight:600;font-size:14px;white-space:nowrap;min-height:42px}
.fc.on{background:var(--gb);border-color:var(--gb);color:#fff}
.in{width:100%;border:1px solid var(--bd);border-radius:12px;padding:11px 12px;background:var(--bg);color:var(--t);font:inherit;min-height:44px}
label{display:block;font-size:13px;color:var(--m);font-weight:600;margin:10px 0 0}
label .in{margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:700;color:var(--t);white-space:nowrap}
.pill .i{width:14px;height:14px}
.pill.on{background:rgba(31,157,77,.2)}.pill.on .i{color:var(--g)}
.pill.off{background:rgba(120,135,125,.22)}
.pill.q{background:rgba(43,143,214,.2)}.pill.q .i{color:var(--w)}
.pill.al{background:rgba(212,82,11,.22)}.pill.al .i{color:var(--al)}
.pill.rd{background:rgba(211,47,50,.2)}

/* ========== INICIO: ZONAS ========== */
.sec{display:flex;justify-content:space-between;align-items:center;padding:0 16px;margin-bottom:4px}
.sec h3{margin:0;font-size:19px}
.cnt{background:var(--c);border:1px solid var(--bd);border-radius:10px;padding:3px 12px;font-weight:700}
.stl{display:flex;align-items:center;gap:6px;justify-content:flex-end;padding:0 16px 10px;font-size:13px;font-weight:600}
.stl.ok{color:var(--g)}.stl.al{color:var(--al)}
.zc{display:flex;gap:12px}
.th{width:84px;min-height:112px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:40px}
.zb{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.zt{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.zt b{font-size:15.5px;line-height:1.25;padding-top:8px}
.rn{display:flex;align-items:center;gap:6px;flex:1;min-width:0;flex-wrap:wrap}
.rn .in{flex:1;min-width:90px}
.rn .zp{font-weight:800;font-size:14px}
.tm2{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.tm2 .i{width:16px;height:16px;color:var(--w)}
.tm2 .pc{margin-left:auto;color:var(--m);font-weight:600}
.pbar{height:7px;border-radius:9px;background:rgba(120,135,125,.25);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--g);width:0;transition:width .4s}
.zr2{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.stp{display:flex;align-items:center;gap:7px}
.stp button{width:36px;height:36px;border-radius:10px;border:1px solid var(--bd);background:var(--c);color:var(--t);font-size:20px;line-height:1;padding:0}
.stp b{min-width:22px;text-align:center;font-size:16px}
.zr2 .btn{min-height:44px;padding:8px 16px;flex:1;min-width:104px}
.ai{display:flex;gap:12px;background:var(--gl)}
.aib{width:38px;height:38px;border-radius:50%;border:2px solid var(--g);color:var(--g);font-weight:800;font-size:13px;display:grid;place-items:center;flex:none}
.tx{flex:1;min-width:0}
.tx .row{margin-bottom:2px}

/* ========== BANNERS DE ESTADO ========== */
.bn{display:flex;gap:10px;align-items:flex-start;margin:0 14px 12px;border-radius:16px;padding:12px 14px;border:1.5px solid}
.bn .i{width:24px;height:24px;margin-top:2px}
.bn .btn{margin-top:8px;min-height:42px;padding:8px 16px;display:inline-flex}
.bn.rd{background:rgba(211,47,50,.12);border-color:var(--rd)}.bn.rd>.i{color:var(--rd)}
.bn.al{background:rgba(212,82,11,.12);border-color:var(--al)}.bn.al>.i{color:var(--al)}
.bn.w{background:rgba(43,143,214,.12);border-color:var(--w)}.bn.w>.i{color:var(--w)}
.bn.g{background:rgba(31,157,77,.1);border-color:var(--g)}.bn.g>.i{color:var(--g)}

/* ========== PROGRAMAS ========== */
.pg{display:flex;gap:12px;align-items:center}
.pi{width:44px;font-size:32px;text-align:center;flex:none}
.pg .tx b{font-size:16px}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.ibs{display:flex;gap:8px}
.dl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.dl button{border:2px solid transparent;background:var(--bg);color:var(--t);border-radius:12px;padding:10px 2px;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:5px;font-weight:600}
.dl button.on{border-color:var(--w);background:rgba(43,143,214,.14)}
.dl .i{width:26px;height:26px;color:var(--w)}
.cr{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--bd)}
.cr>span{width:34px;font-weight:700;flex:none}
.cl{font-size:13px}.cl b{font-variant-numeric:tabular-nums}

/* ========== CLIMA E IA: REGLAS ========== */
.rl{display:flex;align-items:center;gap:10px;padding:8px 0}
.rl>.i{color:var(--w)}
.rl>span{flex:1;font-size:13.5px;color:var(--m)}
.rv{display:flex;align-items:center;gap:3px;border:1px solid var(--bd);border-radius:10px;padding:0 10px;background:var(--c);flex:none}
.rv input{border:0;background:none;width:50px;text-align:right;font:inherit;font-weight:700;color:var(--t);padding:9px 2px;min-height:40px}
.rv small{font-weight:600}
.rv.off{opacity:.5}
.rec{border-top:1px solid var(--bd);padding:10px 0;font-size:13.5px}

/* ========== HISTORIAL ========== */
.dh{font-weight:800;padding:12px 0 4px}
.ev{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--bd)}
.ev .tm{width:42px;font-size:12px;color:var(--m);flex:none;padding-top:8px;font-variant-numeric:tabular-nums}
.ei{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;background:#2b8fd6}
.ei .i{width:18px;height:18px}
.ei.play,.ei.check{background:#1f9d4d}.ei.cal{background:#3a6fd0}.ei.cloud{background:#6f8191}.ei.gear{background:#6b7a86}.ei.warn{background:#d9731a}.ei.stop{background:#d32f32}
.bars{display:flex;gap:6px;align-items:flex-end;text-align:center;font-size:11px;color:var(--m);margin:10px 0 4px;min-height:92px}
.bars div{flex:1}.bars i{display:block;background:var(--w);border-radius:5px 5px 0 0;min-height:2px}

/* ========== AJUSTES ========== */
.pw{display:flex;gap:8px;margin-top:4px}.pw .in{margin:0}
.cs{margin-top:10px;font-size:13px;font-weight:600}
.cs.ok{color:var(--g)}.cs.warn{color:var(--al)}.cs.err{color:var(--rd)}.cs.idle,.cs.wait{color:var(--m)}
.zrow{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--bd)}
.zi{width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);display:grid;place-items:center;color:var(--m);flex:none}
.seg{display:flex;gap:6px}.seg .fc{flex:1;padding:9px 4px;text-align:center}
.dp{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--bd);font-size:13px}
.inf{display:flex;gap:12px;align-items:center}.inf .lg{width:54px;height:54px}

/* ========== MENÚ INFERIOR, AVISOS Y VENTANA ========== */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:var(--nav);display:flex;gap:2px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:20;border-radius:20px 20px 0 0}
nav button{flex:1;background:none;border:0;color:#b9c7be;font-size:11px;padding:8px 2px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px}
nav button.on{background:var(--gb);color:#fff;font-weight:700}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#14231a;color:#fff;padding:11px 16px;border-radius:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50;width:max-content;max-width:88%;text-align:center;font-size:14px}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--c);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.sheet h3{font-size:19px}
.sheet .row{margin-top:12px}.sheet .btn.w{margin-top:12px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
'use strict';
/* =====================================================================
   RIEGOS24 SMART IRRIGATION · panel conectado al backend.
   - Las órdenes físicas se envían a la API autenticada.
   - El estado se muestra como confirmado solo tras leer el controlador.
   - El clima se consulta a Open-Meteo; el backend mantiene sus propias reglas.
   ===================================================================== */
const $=i=>document.getElementById(i),pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],DFULL=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

/* ---------- Iconos ---------- */
const IC={
home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>',
cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
cloud:'<path d="M7 18a4.5 4.5 0 1 1 .9-8.9A6 6 0 0 1 19.5 11 3.5 3.5 0 0 1 19 18z"/>',
list:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/>',
pen:'<path d="M4 20h4L19.5 8.5a2 2 0 0 0 0-3l-1-1a2 2 0 0 0-3 0L4 16z"/>',
trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>',
play:'<path d="M8 5l11 7-11 7z" fill="currentColor"/>',
stop:'<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>',
pause:'<path d="M8 5v14M16 5v14"/>',
eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
x:'<path d="M6 6l12 12M18 6L6 18"/>',
warn:'<path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.5h.01"/>',
info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
drop:'<path d="M12 3s6.5 6.5 6.5 11a6.5 6.5 0 0 1-13 0C5.5 9.5 12 3 12 3z" fill="currentColor"/>',
pin:'<path d="M12 21s7-6.2 7-11.5a7 7 0 0 0-14 0C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
ban:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
wind:'<path d="M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7"/>'};
const ico=(n,c)=>'<svg class="i'+(c?' '+c:'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>';

let REALWX=null; const W=()=>REALWX||{n:'Clima no disponible',e:'🌤️',t:'—',tx:'—',tn:'—',h:'—',pop:'—',rec:'—',f3:'—',w:'—'};
const B7=[[28,16,0],[29,17,5],[26,18,60],[25,16,80],[27,15,10],[29,17,0],[30,18,0]];

return B7.map((x,i)=>{const o=i===0?{x:w.tx,n:w.tn,p:w.pop}:{x:x[0]+sh,n:x[1]+sh,p:x[2]};return{d:i===0?'Hoy':DAYS[(wd+i)%7],x:o.x,n:o.n,p:o.p,e:o.p>=60?'🌧️':o.p>=30?'🌦️':o.p>=10?'⛅':'☀️'}})}

/* Decisión climática: explica qué hace y por qué */
function decide(){const w=W(),why=[];let f=1,skip=false;
if(S.mode==='manual')why.push('Modo manual: no hay riegos automáticos.');
else if(S.mode==='sched')why.push('Modo programado: se usa la duración fijada, sin ajustes climáticos.');
else if(S.mode==='vac'){f=.6;why.push('Modo vacaciones: duración reducida al 60 %.')}
else{
if(REALWX&&S.a.fc&&((w.pop>=S.pop&&w.f3>=MINMM)||w.f3>=S.mm3)){skip=true;why.push('Se esperan '+w.f3+' mm en 3 h (probabilidad '+w.pop+' %): se pospone el riego.')}
else if(REALWX&&S.a.fc&&w.pop>=S.pop)why.push('Probabilidad '+w.pop+' %, pero solo '+w.f3+' mm previstos: no se cancela.');
if(REALWX&&S.a.recent&&w.rec>=S.recMm){skip=true;why.push('Ya llovieron '+w.rec+' mm hoy: se cancela la sesión.')}
if(REALWX&&S.a.wind&&w.w>=S.wind){skip=true;why.push('Viento de '+w.w+' km/h (límite '+S.wind+'): se pospone.')}
if(REALWX&&!skip&&S.a.temp&&w.t>=30){f=1.2;why.push('Calor ('+w.t+' °C): +20 % de duración, dentro del máximo de cada zona.')}
else if(REALWX&&!skip&&S.a.temp&&w.t<=15){f=.8;why.push('Fresco ('+w.t+' °C): −20 % de duración.')}}
if(!why.length)why.push('Sin ajustes: se usa la duración programada.');
return{f,skip,why}}
const need=z=>Math.max(1,2+.15*(W().t-10))*KC[z.veg]*z.m2*7/EF[z.type];
const sched=z=>P.filter(p=>p.on&&p.z[z.id]).reduce((a,p)=>a+p.z[z.id]*z.lpm*p.days.length,0);
function aiHead(){const d=decide();
if(!online)return{k:'al',c:'Revisar',ti:'Controlador sin verificar',t:'No se puede iniciar el riego hasta consultar el estado real del relé.'};
 if(!REALWX)return{k:'al',c:'Sin clima',ti:'Pronóstico no disponible',t:'No se pudo consultar el clima real. No tomes decisiones automáticas basadas en datos simulados.'};
if(d.skip&&!ovr)return{k:'q',c:'Posponer',ti:'Riego pospuesto',t:'Se recomienda posponer el riego. '+d.why.filter(x=>/pospone|cancela/.test(x)).join(' ')};
return{k:'ok',c:'Riego OK',ti:'Sistema listo',t:'No se detectan condiciones de lluvia o viento. Podés regar normalmente. No hay sensor de suelo: la decisión usa solo el pronóstico.'}}

/* ---------- Adaptador local antiguo (sobrescrito por la API real más abajo) ---------- */
function cmd(z,on){const r=R[z.id],o=on?'ON':'OFF',e=log(z,'Orden '+o+' · Zona '+z.id,'Enviada ('+z.dp+', adaptador simulado)','sistema','info');
setTimeout(()=>{if(!online){r.st='unknown';e.det='Sin respuesta de la API: estado desconocido';e.ic='warn';note('err','Zona '+z.id+': sin respuesta, estado desconocido');return render()}
e.det='Aceptada por la API';
setTimeout(()=>{if(!online){r.st='unknown';e.det='Sin confirmación del dispositivo: estado desconocido';e.ic='warn';note('err','Zona '+z.id+': orden sin confirmar');return render()}
r.st=on?'on':'off';e.det='Confirmada por el dispositivo (simulado)';e.ic='check';render()},500)},400)}

/* ---------- Motor de riego ---------- */
function enqueue(z,sec,src){const r=R[z.id],tot=Q.reduce((a,q)=>a+q.sec,0)+Z.reduce((a,x)=>a+R[x.id].left,0);
if(S.locked){toast('Parada de seguridad activa: revisá y rearmá el sistema');return}
if(!online){log(z,'Riego no iniciado','Sin conexión con el relé: no se envió ninguna orden','riego','warn',1);note('err','Sin conexión: no se inició la Zona '+z.id);return}
if(r.want==='on'||Q.some(q=>q.z===z.id)){log(z,'Ejecución duplicada bloqueada','Zona '+z.id+' ya está regando o en cola','sistema','warn');toast('Esa zona ya está regando o en cola');return}
sec=Math.min(sec,z.max*60);
if(tot+sec>S.max*60){log(z,'Límite de sesión superado','No se programa: máximo '+S.max+' min por sesión','sistema','warn');toast('Se superaría el tiempo máximo por sesión');return}
Q.push({z:z.id,sec,src});SES.tot++;next()}
function next(){if(!paused){
while(Q.length){if(S.seq&&Z.some(x=>R[x.id].want==='on'))break;
const q=Q.shift(),z=Z.find(x=>x.id===q.z),r=R[z.id];
if(!online){log(z,'Riego no iniciado','Sin conexión con el relé','riego','warn',1);continue}
r.want='on';r.left=r.tot=q.sec;r.src=q.src;
log(z,'Zona '+z.id+' iniciada ('+q.src+')',Math.round(q.sec/60)+' min','riego','play',1);note('start','Zona '+z.id+' iniciada: '+z.name);cmd(z,true)}}
if(!Z.some(x=>R[x.id].want==='on')&&!Q.length)SES={tot:0,done:0}}
function runProg(p,force){
const zs=Object.keys(p.z).map(id=>[Z.find(x=>x.id==id),p.z[id]]).filter(x=>x[0]&&x[1]>0);
if(!zs.length){log(null,'Programa sin zonas',p.name,'programa','warn');return}
if(!force&&S.delayUntil>T){log(null,'Programa pospuesto',p.name+': retraso por clima hasta '+fmtD(S.delayUntil)+' '+fmt(S.delayUntil),'clima','cloud');return}
const dd=force||ovr?{f:1,skip:false,why:[force?'Ejecución manual: sin ajustes climáticos.':'Decisión climática anulada manualmente.']}:decide();
if(!force)zs.forEach(x=>{ST.base+=x[1]});
if(dd.skip){ST.sk++;log(null,'Retraso por clima aplicado',p.name+': '+dd.why.join(' '),'clima','cloud');return}
log(null,'Programa ejecutado',p.name+(dd.f!==1?' ('+dd.why[0]+')':''),'programa','cal');
zs.forEach(x=>{const m=Math.min(Math.round(x[1]*dd.f),x[0].max);if(!force)ST.used+=m;enqueue(x[0],m*60,force?'manual':'automático')})}
function nextRun(zid){let b=null;if(!S.armed||S.locked||S.mode==='manual')return null;const t=loc(T),from=Math.max(T,S.delayUntil);
for(let k=0;k<8;k++){const day=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate()+k));
P.forEach(p=>{if(!p.on||!p.days.includes(day.getUTCDay())||(zid&&!(p.z[zid]>0)))return;const hm=p.time.split(':').map(Number),f=day.getTime()+(hm[0]*60+hm[1])*6e4-OFF;if(f>from&&(!b||f<b.f))b={f,p}})}
return b}
function tick(){const now=Date.now(),adv=Math.min(now-lastReal,30000)*S.speed;lastReal=now;last=T;T+=adv;const dt=adv/1e3,d=dayNum(T);
if(S.delayUntil&&S.delayUntil<=T){S.delayUntil=0;S.delayH=0;log(null,'Retraso por clima finalizado','Los programas vuelven a su horario','clima','cloud');render()}
if(S.armed&&!S.locked&&S.mode!=='manual'&&!paused){const wd=loc(T).getUTCDay();
P.forEach(p=>{if(!p.on||!p.days.includes(wd))return;const hm=p.time.split(':').map(Number),f=d*864e5+(hm[0]*60+hm[1])*6e4-OFF,k=p.id+'-'+d;
if(last<f&&f<=T&&!fired.has(k)){fired.add(k);runProg(p);render()}})}
if(!paused)Z.forEach(z=>{const r=R[z.id];if(r.want!=='on')return;r.left-=dt;
if(r.left<=0){r.want='off';r.left=0;ST.liters+=r.tot/60*z.lpm;dm[d]=(dm[d]||0)+r.tot/60;SES.done++;
log(z,'Zona '+z.id+' finalizada','Duración: '+Math.round(r.tot/60)+' min','riego','check');note('end','Zona '+z.id+' finalizada: '+z.name);cmd(z,false);next();render()}})}
function pause(){paused=!paused;Z.forEach(z=>{if(R[z.id].want==='on')cmd(z,!paused)});log(null,paused?'Riego en pausa':'Riego reanudado',paused?'Válvulas cerradas; el tiempo restante se conserva':'','riego',paused?'pause':'play');if(!paused)next()}
function stop(){Q=[];paused=false;SES={tot:0,done:0};S.locked=true;Z.forEach(z=>{const r=R[z.id];r.want='off';r.left=0;cmd(z,false)});log(null,'Parada de seguridad','Orden OFF a todas las zonas; programas bloqueados hasta rearmar','riego','stop');note('err','Parada de seguridad: todas las zonas en OFF')}
function setOnline(v){online=v;log(null,v?'Conexión recuperada':'Conexión perdida (simulada)',v?'Se verifica el estado de cada zona':'Las zonas quedan con estado desconocido','sistema',v?'check':'warn');
Z.forEach(z=>{const r=R[z.id];if(!v){if(r.st==='on'||r.want==='on')r.st='unknown'}else if(r.want==='off'&&r.st!=='off')cmd(z,false);else if(r.want==='on'&&r.st==='unknown')cmd(z,true)});
if(!v)note('err','Se perdió la conexión con el relé')}

/* ---------- Conexión con el backend (solo comprueba que el servidor responde) ---------- */
async function checkConn(){const u=(S.url||'').trim(),when=()=>{const n=Date.now();return fmtDate(n)+', '+fmt(n)};
if(!/^https?:\/\/[^\s]+$/i.test(u)){conn={st:'err',msg:'Ingresá una URL válida que empiece con https://'};return render(1)}
conn={st:'wait',msg:'Comprobando…'};render(1);
const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),10000);
try{const r=await fetch(u,{signal:ctl.signal,cache:'no-store'});conn={st:r.ok?'ok':'warn',msg:(r.ok?'Servidor accesible':'El servidor respondió con error')+' (HTTP '+r.status+'). Última consulta: '+when()}}
catch(e){try{await fetch(u,{mode:'no-cors',signal:ctl.signal,cache:'no-store'});conn={st:'warn',msg:'El servidor responde, pero el navegador no puede leer la respuesta (CORS). Última consulta: '+when()}}catch(_){conn={st:'err',msg:'No se pudo conectar con el servidor. Revisá la URL y tu conexión.'}}}
clearTimeout(to);render(1)}

function zc(z){const r=R[z.id],on=r.want==='on',qd=Q.some(q=>q.z===z.id),n=nextRun(z.id),blk=S.locked||!online;
const chip=r.st==='unknown'?'<span class="pill al">'+ico('warn')+' DESCONOCIDO</span>':on?(paused?'<span class="pill q">PAUSADO</span>':'<span class="pill on">'+ico('drop')+' REGANDO</span>'):qd?'<span class="pill q">EN COLA</span>':'<span class="pill off">'+ico('drop')+' APAGADO</span>';

const mid=on?'<div class="tm2">'+ico('drop')+'<span id="cd'+z.id+'"></span> / '+Math.round(r.tot/60)+' min<span class="pc" id="pc'+z.id+'"></span></div><div class="pbar"><i id="pb'+z.id+'"></i></div>':'<div class="s">'+(n?'Próximo: '+fmtD(n.f)+' '+fmt(n.f):'Sin riego programado')+'</div>';
return '<div class="card zc"><div class="th" style="background:'+z.bg+'" aria-hidden="true">'+z.ic+'</div><div class="zb"><div class="zt">'+nm+'</div><div>'+chip+'</div>'+mid+'<div class="zr2"><div class="stp"><button data-a="dm" data-i="'+z.id+'" aria-label="Menos tiempo">−</button><b>'+z.sel+'</b><button data-a="dp" data-i="'+z.id+'" aria-label="Más tiempo">+</button><span class="s">min</span></div>'+btn+'</div></div></div>'}

const API_DEFAULT='https://riegos24-smart-irrigation.onrender.com';
let apiBusy=false, lastWeatherAt=0, serverSequence=null, realEvents=[];
function apiBase(){return (S.url||API_DEFAULT).trim().replace(/\/+$/,'')}
async function apiFetch(path,method='GET',body){
  if(!KEY.trim()) throw new Error('Ingresá API_ACCESS_KEY en Ajustes.');
  const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),12000);
  try{
    const res=await fetch(apiBase()+path,{method,headers:{'Content-Type':'application/json','x-api-key':KEY.trim()},body:body===undefined?undefined:JSON.stringify(body),cache:'no-store',signal:ctl.signal});
    const data=await res.json().catch(()=>({}));
    if(!res.ok||data.ok===false) throw new Error(data.error||('Error HTTP '+res.status));
    return data;
  } finally {clearTimeout(timer)}
}
async function refreshRealStatus(showToast=false){
  try{
    const d=await apiFetch('/api/device/status');
    online=true;
    (d.zones||[]).forEach(q=>{
      const r=R[q.id]; if(!r)return;
      r.st=(q.known&&typeof q.on==='boolean')?(q.on?'on':'off'):'unknown';
      r.want=r.st==='on'?'on':'off';
      if(r.st!=='on'){r.left=0;r.tot=0}
    });
    conn={st:d.statusConfirmed?'ok':'warn',msg:d.statusConfirmed?'Controlador conectado; estado de los dos relés confirmado.':'API conectada, pero no se pudo confirmar el estado de ambos relés.'};
    if(showToast)toast(conn.msg);
  }catch(e){
    online=false;Z.forEach(z=>{R[z.id].st='unknown';R[z.id].want='off'});
    conn={st:'err',msg:'No se pudo verificar el controlador: '+e.message};
    if(showToast)toast(conn.msg);
  }
  render(1);
}
async function checkConn(){
  const u=apiBase();
  if(!/^https:\/\/[^\s]+$/i.test(u)){conn={st:'err',msg:'Ingresá una URL HTTPS válida.'};return render(1)}
  conn={st:'wait',msg:'Comprobando API y controlador…'};render(1);
  try{
    const health=await fetch(u+'/api/health',{cache:'no-store',signal:AbortSignal.timeout(10000)});
    const h=await health.json();
    if(!health.ok||!h.ok)throw new Error('La API no respondió correctamente.');
    await refreshRealStatus(false);
    if(online){
      try{await loadRemoteConfig()}catch(e){console.warn('Configuración no disponible:',e.message)}
      try{await loadRemotePrograms()}catch(e){console.warn('Programas no disponibles:',e.message)}
      try{await loadRemoteHistory()}catch(e){console.warn('Historial no disponible:',e.message)}
      await fetchRealWeather();
      conn={st:'ok',msg:'API y controlador comprobados. Los estados provienen de Tuya.'}
    }else{conn={st:'warn',msg:'API accesible, pero el controlador no confirmó ambos relés.'}}
  }catch(e){online=false;conn={st:'err',msg:e.message||'No se pudo conectar.'}}
  save();render(1);
}
async function loadRemotePrograms(){
  const d=await apiFetch('/api/programs');

  if(d.programs.length===0){await saveRemotePrograms();return;}
  P=d.programs.map((p,i)=>({id:Number(p.id)||i+1,name:String(p.name||('Programa '+(i+1))),ic:'💧',z:{1:Number(p.durations?.[1]||0),2:Number(p.durations?.[2]||0)},days:Array.isArray(p.days)?p.days:[],time:p.time||'07:00',on:p.enabled===true,delayUntil:p.delayUntil||null}));
  if(!P.length)P=[];
  S.armed=P.some(p=>p.on);save();
}

  if(!online||!KEY.trim())return;

  if(S.locked&&on)throw new Error('Parada de seguridad activa. Rearmá el sistema antes de regar.');
  if(on){
    if(!confirm('¿Confirmás regar '+z.name+' durante '+z.sel+' minutos?'))return;
    const d=await apiFetch('/api/zones/'+z.id+'/command','POST',{on:true,confirm:'I_CONFIRM_WATERING',durationMinutes:z.sel});
    toast(d.warning||('Orden de riego enviada a '+z.name+'. La aceptación no equivale a medir caudal.'));
  }else{
    await apiFetch('/api/zones/'+z.id+'/command','POST',{on:false});
    toast('Orden OFF enviada a '+z.name+'. Consultando estado real…');
  }
  await new Promise(r=>setTimeout(r,700));
  await refreshRealStatus(false);
}
function tick(){T=Date.now();if(online&&Date.now()-lastReal>5000){lastReal=Date.now();refreshRealStatus(false).catch(()=>{})}}
function cmd(z,on){if(!z)return;realZoneCommand(z,!!on).catch(e=>toast('No se pudo enviar la orden: '+e.message));}
function enqueue(z,seconds,source){if(!z)return;z.sel=Math.max(1,Math.min(240,Math.ceil(Number(seconds||60)/60)));realZoneCommand(z,true).catch(e=>toast('No se pudo iniciar el riego: '+e.message));}
function next(){return null}
function runProg(){toast('Los programas horarios se ejecutan en el servidor cuando están guardados y habilitados.');}
function pause(){toast('Pausar no está disponible en el backend. Para cerrar las válvulas, usá Detener todo.');}
function stop(){realStopAll().catch(e=>toast('No se pudo detener: '+e.message))}
function setOnline(){refreshRealStatus(true)}

/* ---------- Inicio ---------- */
load();OFF=S.tz*36e5;applyTheme();
$('nav').innerHTML=[['home','home','Inicio'],['zones','drop','Zonas'],['prog','cal','Programas'],['wx','cloud','Clima e IA'],['hist','list','Historial'],['set','gear','Ajustes']].map(x=>'<button data-a="nav" data-k="'+x[0]+'">'+ico(x[1])+x[2]+'</button>').join('');
render(1);fetchRealWeather();setInterval(()=>{tick();upd()},5000);
</script>
